# Subscription plans — image vs video monthly caps; video quota is in **units** (video_billing_unit_seconds each).
# Longer videos consume more units (see billing_quota.video_units_for_duration).
#
# Actual fal.ai API costs (per 5-second video):
#   basic tier  → Kling v1 Standard  → $0.225
#   pro tier    → Kling v1.6 Pro     → ~$0.70
#   premium tier→ Kling v1 Standard  → $0.225  (Master was $2.80 — loss-making)

video_billing_unit_seconds: 15

plans:
  free:
    display_name: "Free"
    price_monthly: 0
    stripe_price_id: null
    features:
      max_image_generations_per_month: 8
      max_video_generations_per_month: 2
      max_upload_size_mb: 10
      available_tiers:
        - basic
      max_video_duration: 10
      watermark: true
      priority: low

  basic:
    display_name: "Basic"
    price_monthly: 12
    stripe_price_id: null
    features:
      max_image_generations_per_month: 90
      max_video_generations_per_month: 12      # 12 × $0.225 = $2.70 fal cost  →  $9.30 margin
      max_upload_size_mb: 50
      available_tiers:
        - basic
      max_video_duration: 15
      watermark: false
      priority: normal

  pro:
    display_name: "Pro"
    price_monthly: 29
    stripe_price_id: null
    features:
      max_image_generations_per_month: 240
      max_video_generations_per_month: 20      # 20 × $0.70 = $14 fal cost  →  $15 margin
      max_upload_size_mb: 200
      available_tiers:
        - basic
        - pro
      max_video_duration: 30
      watermark: false
      priority: high

  premium:
    display_name: "Studio"
    price_monthly: 59
    stripe_price_id: null
    features:
      max_image_generations_per_month: 520
      max_video_generations_per_month: 40      # 40 × $0.225 = $9 fal cost  →  $50 margin
      max_upload_size_mb: 500
      available_tiers:
        - basic
        - pro
        - premium
      max_video_duration: 60
      watermark: false
      priority: highest

generation_costs:
  basic: 0.08
  pro: 0.15
  premium: 0.08
