# Credit Economics- single source of truth for frontend AND backend.
# Change pricing here; no code changes required.
#
# Revenue model:  1 credit ≈ $0.01 platform price
# Margin floor:   provider_cost_usd  ×  2.2  ≤  credits × $0.01  (≥ 50% gross margin)

# ── Per-model credit costs (per generation / per 5-second clip) ──────────────
model_credit_costs:
  # ── Kling series ────────────────────────────────────────────────────────────
  kling_standard:    10    # provider ~$0.028/5s  →  margin ~78%  ✅
  kling_pro:         98    # provider ~$0.490/5s  →  margin ~60%
  kling_21_pro:      98    # provider ~$0.490/5s  →  margin ~60%
  kling_21_master:   60    # provider ~$0.280/5s  →  margin ~63%  ✅
  kling_26_pro:      98    # provider ~$0.490/5s  →  margin ~60%  (v2.6- native audio)
  kling_30_pro:      140   # provider ~$0.700/5s  →  margin ~60%  (v3.0- newest, audio)
  # ── Seedance series ─────────────────────────────────────────────────────────
  seedance_fast:         242   # provider ~$1.209/5s  →  margin ~60%  (fast tier)
  seedance_standard:     160   # provider ~$0.800/5s  →  margin ~60%  (standard quality, audio)
  # ── Seedance Reference-to-Video ─────────────────────────────────────────────
  seedance_ref:          160   # provider ~$0.800/5s  →  margin ~60%  (reference-guided, audio)
  seedance_fast_ref:     242   # provider ~$1.209/5s  →  margin ~60%  (fast reference-guided, audio)
  # ── PixVerse ────────────────────────────────────────────────────────────────
  pixverse_v6:           50    # provider ~$0.040/5s  →  margin ~60%  (1080p, audio)
  pixverse_c1:           40    # provider ~$0.200/5s  →  margin ~60%  (1080p, audio)
  # ── PixVerse C1 Transition ───────────────────────────────────────────────────
  pixverse_c1_transition: 40   # provider ~$0.200/5s  →  margin ~60%  (start→end morph, 1080p)
  # ── Other providers ──────────────────────────────────────────────────────────
  minimax:           110   # provider ~$0.500/5s  →  margin ~64%  ✅
  wan:               100   # provider ~$0.500/5s  →  margin ~60%
  luma:              35    # provider ~$0.150/5s  →  margin ~66%  ✅
  default:           98    # fallback for unlisted models

# ── Image generation credit costs (per image) ────────────────────────────────
image_credit_costs:
  # ── FLUX series ─────────────────────────────────────────────────────────────
  flux_schnell:      4     # provider ~$0.003/img →  margin ~60%  (fast draft)
  flux_dev:          8     # provider ~$0.040/img →  margin ~60%
  flux_pro:          11    # provider ~$0.055/img →  margin ~60%
  flux_2_pro:        15    # provider ~$0.080/img →  margin ~60%  (newest FLUX)
  flux_kontext:      8     # provider ~$0.040/img →  margin ~60%  (advanced editing)
  flux_2_pro_edit:   11    # provider ~$0.055/img →  margin ~60%  (FLUX 2 edit)
  # ── Nano Banana series ───────────────────────────────────────────────────────
  nano_banana:       8     # provider ~$0.040/img →  margin ~60%
  nano_banana_2:     8     # provider ~$0.040/img →  margin ~60%
  nano_banana_pro:   10    # provider ~$0.050/img →  margin ~60%  (Pro quality)
  # ── ByteDance Seedream ────────────────────────────────────────────────────────
  seedream_45:       8     # provider ~$0.040/img →  margin ~60%
  seedream_50:       10    # provider ~$0.050/img →  margin ~60%  (Seedream 5.0)
  seedream_45_edit:  8     # provider ~$0.040/img →  margin ~60%  (Seedream edit)
  # ── Ideogram ─────────────────────────────────────────────────────────────────
  ideogram_v3:       10    # provider ~$0.050/img →  margin ~60%  (known for text quality)
  # ── Fal 3D (image → mesh / GLB, per generation) ─────────────────────────────
  trellis:           28    # Trellis v1- image to 3D
  trellis_2:         36    # Trellis 2- higher quality
  reconviagen:       40    # ReconViaGen 0.5- multi-view friendly GLB
  # ── Story Studio (text_to_story pipeline, flat per-story rate) ───────────────
  # Cost formula (5s clips): N×kling_21_pro(98) + 50 TTS/music overhead
  # Cost formula (10s clips): N×kling_21_pro(196) + 50 overhead  (10s ≈ 2× clip cost)
  # 5s/scene entries
  text_to_story_3:    340     # 3×98  + 46
  text_to_story_5:    540     # 5×98  + 50
  text_to_story_8:    830     # 8×98  + 46
  text_to_story_12:   1226    # 12×98 + 50
  text_to_story_16:   1618    # 16×98 + 50
  text_to_story_20:   2010    # 20×98 + 50
  # 10s/scene entries (2× clip cost)
  text_to_story_3_10s:    638     # 3×196  + 50
  text_to_story_5_10s:    1030    # 5×196  + 50
  text_to_story_8_10s:    1618    # 8×196  + 50
  text_to_story_12_10s:   2402    # 12×196 + 50
  text_to_story_16_10s:   3186    # 16×196 + 50
  text_to_story_20_10s:   3970    # 20×196 + 50
  # ── iGaming Asset Generator (igaming_assets, 4 parallel img2img calls) ─────────
  # Flat per-pack rate covering all 4 views (front + 2 angles + promo scene).
  # Keys match what the frontend sends as image_model for credit lookup.
  igaming_flux_schnell:  30    # 4×Flux Schnell  → provider ~$0.012 → margin ~58%
  igaming_flux_dev:      40    # 4×Flux Dev      → provider ~$0.160 → margin ~57%
  igaming_flux_pro:      44    # 4×Flux Pro      → provider ~$0.220 → margin ~56%
  igaming_flux_2_pro:    50    # 4×Flux 2 Pro    → provider ~$0.320 → margin ~55%
  igaming_standard:      30    # alias (legacy/fallback)
  igaming_premium:       50    # alias (legacy/fallback)
  default:           8     # fallback

# ── Subscription monthly credit grants ───────────────────────────────────────
# Credits are granted on first successful payment and on each renewal invoice.
subscription_credits:
  free:     0        # Zero-free policy- no free generations
  basic:    1200     # $15/mo  →  $0.0125/credit avg
  pro:      3200     # $30/mo  →  $0.0094/credit avg
  premium:  7000     # $59/mo  →  $0.0084/credit avg

# ── Top-up packs ─────────────────────────────────────────────────────────────
topup_credits:
  standard:   800    # $10 - available to all plans
  pro_bonus:  960    # $10 - Pro subscribers get 20% more credits

# ── Safety policies ──────────────────────────────────────────────────────────
velocity_limits:
  new_account_days: 5                  # accounts younger than N days are "new"
  new_account_credits_per_24h: 1500    # max spendable credits per 24 h for new accounts

circuit_breaker:
  failure_window_minutes: 15           # rolling window for failure tracking
  failure_threshold: 3                 # consecutive failures before cooldown
  cooldown_minutes: 30                 # duration of generation block

# ── Bonus credit expiry ───────────────────────────────────────────────────────
# Paid (subscription/top-up) credits: never expire.
# Bonus (promotional) credits:         expire after this many days.
bonus_expiry_days: 30
