version: "3.8"

services:
  # ── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: adgen-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adgen_secret}
      POSTGRES_DB: ${POSTGRES_DB:-adgen_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adgen}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - adgen-net

  # ── Redis ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: adgen-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - adgen-net

  # ── MinIO (S3-compatible Object Storage) ────────────
  minio:
    image: minio/minio:latest
    container_name: adgen-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adgen-net

  # ── MinIO Bucket Init ──────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: adgen-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${STORAGE_ACCESS_KEY:-minioadmin} $${STORAGE_SECRET_KEY:-minioadmin};
      mc mb local/$${STORAGE_BUCKET:-adgen-media} --ignore-existing;
      mc anonymous set download local/$${STORAGE_BUCKET:-adgen-media};
      exit 0;
      "
    networks:
      - adgen-net

  # ── Backend API (FastAPI) ──────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adgen-api
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./config:/app/config
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - adgen-net

  # ── Celery Worker ──────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adgen-worker
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=image_generation,video_generation,post_processing
    volumes:
      - ./backend:/app
      - ./config:/app/config
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - adgen-net

  # ── Frontend (Next.js) ─────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: adgen-frontend
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    depends_on:
      - api
    networks:
      - adgen-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  adgen-net:
    driver: bridge
